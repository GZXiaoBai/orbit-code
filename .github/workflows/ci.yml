name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      desktop_build_live:
        description: 'Run credentialed desktop Build live smoke on Ubuntu'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps 2>/dev/null || npx playwright install chromium
      - name: Start dev server
        run: |
          npx vite --host 127.0.0.1 --port 1420 &
          sleep 5
          curl -s http://localhost:1420 > /dev/null || (sleep 5 && curl -s http://localhost:1420 > /dev/null)
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  desktop-webdriver-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 sqlite3 webkit2gtk-driver xvfb libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Verify desktop WebDriver readiness
        run: npm run smoke:desktop-readiness
      - name: Build debug Tauri app for desktop smoke
        timeout-minutes: 20
        run: |
          npm run tauri build -- --debug --no-bundle
          test -x src-tauri/target/debug/orbit-code
      - name: Verify packaged desktop window smoke
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a npm run smoke:desktop-plan
      - name: Verify packaged desktop Build smoke readiness
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a npm run smoke:desktop-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-webdriver-readiness
          path: |
            docs/smoke/latest-tauri-webdriver-readiness.json
            docs/smoke/latest-tauri-webdriver-plan-smoke.json
            docs/smoke/latest-tauri-webdriver-build-smoke.json

  desktop-build-live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_build_live == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: orbit-live-smoke
    env:
      ORBIT_APP_DATA_DIR: /tmp/orbit-live-app-data
      ORBIT_DESKTOP_BUILD_WORKSPACE: /tmp/orbit-desktop-build-workspace
      ORBIT_LIVE_VAULT_BUNDLE_B64: ${{ secrets.ORBIT_LIVE_VAULT_BUNDLE_B64 }}
      ORBIT_DESKTOP_BUILD_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Bootstrap encrypted Orbit live vault
        run: npm run smoke:live-vault:bootstrap
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 sqlite3 webkit2gtk-driver xvfb libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build debug Tauri app for live desktop Build smoke
        timeout-minutes: 20
        run: |
          npm run tauri build -- --debug --no-bundle
          test -x src-tauri/target/debug/orbit-code
      - name: Verify live vault and DeepSeek readiness
        run: npm run smoke:deepseek:live-readiness
      - name: Run approved desktop Build live smoke
        run: |
          dbus-run-session -- xvfb-run -a npm run smoke:desktop-build
          cp docs/smoke/latest-tauri-webdriver-build-smoke.json docs/smoke/latest-tauri-webdriver-build-approve-smoke.json
      - name: Run denied desktop Build live smoke
        env:
          ORBIT_DESKTOP_BUILD_DENY: '1'
        run: |
          dbus-run-session -- xvfb-run -a npm run smoke:desktop-build
          cp docs/smoke/latest-tauri-webdriver-build-smoke.json docs/smoke/latest-tauri-webdriver-build-deny-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-live-smoke
          path: |
            docs/smoke/latest-tauri-webdriver-build-smoke.json
            docs/smoke/latest-tauri-webdriver-build-approve-smoke.json
            docs/smoke/latest-tauri-webdriver-build-deny-smoke.json
            docs/smoke/latest-live-vault-bootstrap.json
            docs/smoke/latest-codex-live-readiness.json

  build:
    needs: [frontend, rust]
    strategy:
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - run: npm run build
      - name: Build Tauri
        timeout-minutes: 25
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx tauri build --bundles deb
          else
            npx tauri build
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: orbit-code-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: orbit-code-windows
          path: src-tauri/target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: orbit-code-linux
          path: src-tauri/target/release/bundle/deb/*.deb
